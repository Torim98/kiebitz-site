<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Kiebitz desktop advertisement</title>
  <style>
    /* Dieselbe Schrift wie auf der Website; andere Schriftsysteme fallen auf
       die Systemschrift zurück, genau wie dort. */
    @font-face {
      font-family: 'Inter Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url(../assets/fonts/inter-latin-wght-normal.woff2) format('woff2-variations');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color-scheme: dark;
      font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111210;
      color: #f2f1ec;

      --bg: #111210;
      --ink: #f2f1ec;
      --ink2: #b9b8ae;
      --ink3: #8b8a82;
      --accent: #22c08a;
      --accent-dim: #17835e;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body:not([data-ready="true"]) { visibility: hidden; }

    .ad {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 15px;
      width: 100%;
      height: 100%;
      min-height: 72px;
      padding: 9px 20px 9px 22px;
      border: 0;
      color: inherit;
      text-decoration: none;
      background:
        radial-gradient(130% 190% at 4% 50%, rgba(34, 192, 138, 0.17), transparent 48%),
        linear-gradient(108deg, #191c19 0%, #121311 58%, #161714 100%);
      animation: enter 0.5s var(--ease) both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    /* Angedeutetes Schachbrett, das zu beiden Seiten ausblendet. */
    .board {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: repeating-conic-gradient(
        rgba(242, 241, 236, 0.022) 0% 25%,
        transparent 0% 50%
      );
      background-size: 40px 40px;
      background-position: right center;
      -webkit-mask-image: linear-gradient(90deg, transparent 22%, #000 72%, transparent 98%);
      mask-image: linear-gradient(90deg, transparent 22%, #000 72%, transparent 98%);
    }

    /* Ein Lichtstreifen wandert alle paar Sekunden über die Fläche. */
    .sheen {
      position: absolute;
      inset: -40% -60%;
      z-index: 0;
      background: linear-gradient(
        104deg,
        transparent 42%,
        rgba(34, 192, 138, 0.09) 49%,
        rgba(242, 241, 236, 0.07) 52%,
        transparent 60%
      );
      transform: translateX(-55%);
      animation: sheen 9s var(--ease) infinite;
    }

    @keyframes sheen {
      0%, 62% { transform: translateX(-55%); }
      100% { transform: translateX(55%); }
    }

    .rail {
      position: absolute;
      inset: 12px auto 12px 0;
      z-index: 0;
      width: 2px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), var(--accent-dim));
      animation: rail 4.6s var(--ease) infinite;
    }

    @keyframes rail {
      0%, 100% { opacity: 0.55; transform: scaleY(0.82); }
      50% { opacity: 1; transform: scaleY(1); }
    }

    .creative,
    .copy,
    .flock,
    .cta { position: relative; z-index: 1; }

    .creative {
      display: none;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(34, 192, 138, 0.3);
      border-radius: 13px;
      background: #103528;
      object-fit: cover;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(34, 192, 138, 0.34);
      animation: bob 5.2s var(--ease) infinite, halo 5.2s var(--ease) infinite;
    }

    .creative[data-visible="true"] { display: block; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes halo {
      0%, 100% { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(34, 192, 138, 0.28); }
      50% { box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34), 0 0 0 7px rgba(34, 192, 138, 0); }
    }

    .copy {
      min-width: 0;
      line-height: 1.2;
    }

    .advertiser {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      color: var(--ink3);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .advertiser::before {
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      animation: blink 2.8s var(--ease) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    .headline {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 680;
      letter-spacing: -0.018em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .body {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: var(--ink2);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Der Kiebitz-Schwarm aus dem Website-Footer. */
    .flock {
      display: flex;
      gap: 6px;
      opacity: 0.75;
    }

    .flock i {
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--accent-dim);
      animation: lift 4.2s var(--ease) infinite;
    }

    .flock i:nth-child(2) { animation-delay: 0.18s; }
    .flock i:nth-child(3) { animation-delay: 0.36s; }
    .flock i:nth-child(4) { animation-delay: 0.54s; }

    @keyframes lift {
      0%, 70%, 100% { transform: translateY(0); opacity: 0.5; }
      35% { transform: translateY(-7px); opacity: 1; }
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid rgba(34, 192, 138, 0.42);
      border-radius: 999px;
      color: #75dfb9;
      font-size: 11.5px;
      font-weight: 650;
      white-space: nowrap;
      transition: border-color 0.2s var(--ease), background-color 0.2s var(--ease), color 0.2s var(--ease);
    }

    .cta::after {
      content: "\2197";
      font-size: 12px;
      transition: transform 0.2s var(--ease);
    }

    .ad:hover .cta {
      border-color: rgba(34, 192, 138, 0.8);
      color: #a4efd3;
      background: rgba(34, 192, 138, 0.1);
    }

    .ad:hover .cta::after { transform: translate(2px, -2px); }
    .ad:hover .creative { border-color: rgba(34, 192, 138, 0.55); }
    .ad:hover .flock { opacity: 1; }

    .ad:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -3px;
    }

    @media (max-width: 760px) {
      .flock { display: none; }
    }

    @media (max-width: 520px) {
      .ad { gap: 10px; padding-inline: 14px 12px; }
      .creative { width: 40px; height: 40px; border-radius: 11px; }
      .body, .advertiser { display: none; }
      .headline { margin: 0; font-size: 13px; }
      .cta { padding: 7px 11px; font-size: 10.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .sheen { display: none; }
    }
  </style>
</head>
<body>
  <a class="ad" id="ad" target="_blank" rel="sponsored noopener noreferrer">
    <span class="board" aria-hidden="true"></span>
    <span class="sheen" aria-hidden="true"></span>
    <span class="rail" aria-hidden="true"></span>
    <img class="creative" id="creative" alt="">
    <span class="copy">
      <span class="advertiser" id="advertiser"></span>
      <span class="headline" id="headline"></span>
      <span class="body" id="body"></span>
    </span>
    <span class="flock" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="cta" id="cta"></span>
  </a>
  <script>
    (() => {
      "use strict";

      const STATUS_SOURCE = "kiebitz-desktop-ad";
      const advertisementLabels = {
        de: "Werbung",
        en: "Advertisement",
        fr: "Publicité",
        es: "Publicidad",
        zh: "广告",
        hi: "विज्ञापन",
        ar: "إعلان"
      };
      const status = (visible) => window.parent.postMessage({
        source: STATUS_SOURCE,
        type: "status",
        visible
      }, "*");

      const localized = (value, languages) => {
        if (typeof value === "string") return value;
        if (!value || typeof value !== "object") return "";
        for (const language of languages) {
          const exact = value[language];
          const base = value[language.split("-")[0]];
          if (typeof exact === "string") return exact;
          if (typeof base === "string") return base;
        }
        if (typeof value.en === "string") return value.en;
        return Object.values(value).find((item) => typeof item === "string") || "";
      };

      const validDate = (value, now, after) => {
        if (!value) return true;
        const time = Date.parse(value);
        return Number.isFinite(time) && (after ? now >= time : now <= time);
      };

      const chooseWeighted = (campaigns) => {
        const weighted = campaigns.map((campaign) => ({
          campaign,
          weight: Math.max(0, Number(campaign.weight) || 1)
        }));
        const total = weighted.reduce((sum, item) => sum + item.weight, 0);
        if (total <= 0) return null;
        const random = new Uint32Array(1);
        crypto.getRandomValues(random);
        let cursor = (random[0] / 0x100000000) * total;
        for (const item of weighted) {
          cursor -= item.weight;
          if (cursor < 0) return item.campaign;
        }
        return weighted.at(-1)?.campaign || null;
      };

      const sameOriginImage = (value) => {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.href);
          return url.origin === window.location.origin ? url.href : null;
        } catch {
          return null;
        }
      };

      const httpsTarget = (value) => {
        try {
          const url = new URL(value);
          return url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      };

      fetch("campaigns.json", { cache: "no-store", credentials: "omit" })
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((config) => {
          const now = Date.now();
          const campaign = chooseWeighted((config.campaigns || []).filter((item) =>
            item && item.enabled === true && httpsTarget(item.href) &&
            validDate(item.startsAt, now, true) && validDate(item.endsAt, now, false)
          ));
          if (!campaign) return status(false);

          const languages = navigator.languages?.length
            ? navigator.languages.map((item) => item.toLowerCase())
            : [(navigator.language || "en").toLowerCase()];
          const language = languages[0].split("-")[0];
          const headline = localized(campaign.headline, languages);
          if (!headline) return status(false);

          const ad = document.getElementById("ad");
          ad.href = httpsTarget(campaign.href);
          const label = advertisementLabels[language] || advertisementLabels.en;
          document.getElementById("advertiser").textContent = campaign.advertiser
            ? `${label} · ${campaign.advertiser}`
            : label;
          document.getElementById("headline").textContent = headline;
          document.getElementById("body").textContent = localized(campaign.body, languages);
          document.getElementById("cta").textContent = localized(campaign.cta, languages) || "Learn more";

          const image = sameOriginImage(campaign.image);
          if (image) {
            const creative = document.getElementById("creative");
            creative.src = image;
            creative.alt = localized(campaign.imageAlt, languages);
            creative.dataset.visible = "true";
          }

          document.body.dataset.ready = "true";
          ad.addEventListener("click", (event) => {
            event.preventDefault();
            window.parent.postMessage({
              source: STATUS_SOURCE,
              type: "open",
              href: ad.href
            }, "*");
          });
          status(true);
        })
        .catch(() => status(false));
    })();
  </script>
</body>
</html>
